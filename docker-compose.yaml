services:
  web_scraper:
    build:
      context: ./web_scraper
      dockerfile: Dockerfile
    volumes:
      - ./web_scraper:/app/web_scraper
      - ./logs_files:/app/logs_files
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-find_my_place}:${POSTGRES_PASSWORD:-find_my_place}@postgres:5432/${POSTGRES_DB:-find_my_place}
      - ELASTIC_URL=elasticsearch:9200
      - ELASTIC_INDEX_NAME=scrapy_items

  ai_bot_app:
    build:
      context: ./ai_bot_app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ai_bot_app:/app/ai_bot_app
      - ./logs_files:/app/logs_files
    depends_on:
      - elasticsearch
      - web_scraper
    environment:
      - ELASTIC_URL=elasticsearch:9200
      - ELASTIC_INDEX_NAME=scrapy_items
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-find_my_place}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-find_my_place}
      - POSTGRES_DB=${POSTGRES_DB:-find_my_place}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 5433 on the host to avoid clashing with a local Postgres on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elasticsearch-data:
  postgres-data:


