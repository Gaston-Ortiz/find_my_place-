version: '3.8'

services:
  web_scraper:
    build:
      context: ./web_scraper
      dockerfile: Dockerfile
    volumes:
      - ./web_scraper:/app/web_scraper
      - ./logs_files:/app/logs_files
    depends_on:
      - elasticsearch
    environment:
      - ELASTIC_URL=elasticsearch:9200
      - ELASTIC_INDEX_NAME=scrapy_items

  ai_bot_app:
    build:
      context: ./ai_bot_app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ai_bot_app:/app/ai_bot_app
      - ./logs_files:/app/logs_files
    depends_on:
      - elasticsearch
      - web_scraper
    environment:
      - ELASTIC_URL=elasticsearch:9200
      - ELASTIC_INDEX_NAME=scrapy_items
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

volumes:
  elasticsearch-data:


